description: >-
  Lettuce (Lettuce Inc.) is a venture-backed startup headquartered in Venice,
  California, surfaced in the API Evangelist network as a 500 Global portfolio
  company. As of the July 2026 enrichment pass the company operates no live
  public surface: lettuceapps.com and every probed subdomain (www, api, docs,
  developer, app) return the same wildcard domain-parking page rather than
  first-party content, and no developer portal, documentation, API reference,
  OpenAPI or AsyncAPI specification, SDK, package-registry release, or
  .well-known discovery document could be located. The company's remaining
  public footprint is a GitHub account holding one internal Node.js proxy
  project and one empty repository. This profile therefore records verified
  identity and live probe results only; it is retained as a dormant portfolio
  lead rather than an active API provider, and carries no fabricated API
  artifacts.
